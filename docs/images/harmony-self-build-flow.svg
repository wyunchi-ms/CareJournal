<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CareJournal HarmonyOS 自行安装流程</title>
  <desc id="desc">依次完成下载源码、安装 DevEco Studio、登录实名认证账号、连接手机并自动签名、运行到手机。</desc>
  <rect width="1200" height="420" rx="32" fill="#ecfeff"/>
  <text x="600" y="62" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#164e63">HarmonyOS 自行安装：只需完成一次的电脑流程</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(55 118)"><rect width="190" height="190" rx="24" fill="#fff" stroke="#0891b2" stroke-width="3"/><circle cx="95" cy="54" r="30" fill="#0891b2"/><text x="95" y="65" font-size="29" font-weight="700" fill="#fff">1</text><text x="95" y="118" font-size="23" font-weight="700" fill="#164e63">下载源码</text><text x="95" y="153" font-size="17" fill="#475569">GitHub / Gitee</text></g>
    <path d="M255 213h42" stroke="#0891b2" stroke-width="5"/><path d="m297 213-14-10v20z" fill="#0891b2"/>
    <g transform="translate(305 118)"><rect width="190" height="190" rx="24" fill="#fff" stroke="#0891b2" stroke-width="3"/><circle cx="95" cy="54" r="30" fill="#0891b2"/><text x="95" y="65" font-size="29" font-weight="700" fill="#fff">2</text><text x="95" y="118" font-size="23" font-weight="700" fill="#164e63">安装 DevEco</text><text x="95" y="153" font-size="17" fill="#475569">下载 SDK</text></g>
    <path d="M505 213h42" stroke="#0891b2" stroke-width="5"/><path d="m547 213-14-10v20z" fill="#0891b2"/>
    <g transform="translate(555 118)"><rect width="190" height="190" rx="24" fill="#fff" stroke="#0891b2" stroke-width="3"/><circle cx="95" cy="54" r="30" fill="#0891b2"/><text x="95" y="65" font-size="29" font-weight="700" fill="#fff">3</text><text x="95" y="118" font-size="23" font-weight="700" fill="#164e63">账号与签名</text><text x="95" y="153" font-size="17" fill="#475569">个人实名认证</text></g>
    <path d="M755 213h42" stroke="#0891b2" stroke-width="5"/><path d="m797 213-14-10v20z" fill="#0891b2"/>
    <g transform="translate(805 118)"><rect width="190" height="190" rx="24" fill="#fff" stroke="#0891b2" stroke-width="3"/><circle cx="95" cy="54" r="30" fill="#0891b2"/><text x="95" y="65" font-size="29" font-weight="700" fill="#fff">4</text><text x="95" y="118" font-size="23" font-weight="700" fill="#164e63">连接手机</text><text x="95" y="153" font-size="17" fill="#475569">开发者模式 + USB</text></g>
    <path d="M1005 213h42" stroke="#059669" stroke-width="5"/><path d="m1047 213-14-10v20z" fill="#059669"/>
    <g transform="translate(1055 118)"><rect width="100" height="190" rx="24" fill="#059669"/><text x="50" y="72" font-size="38" font-weight="700" fill="#fff">5</text><text x="50" y="120" font-size="22" font-weight="700" fill="#fff">运行</text><text x="50" y="153" font-size="17" fill="#fff">安装完成</text></g>
  </g>
  <text x="600" y="370" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#164e63">调试签名只对你连接的设备有效；以后升级时重新打开项目并点击 Run 即可。</text>
</svg>
