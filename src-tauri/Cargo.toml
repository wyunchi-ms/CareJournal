[package]
name = "carejournal"
version = "0.19.21"
description = "CareJournal desktop backend"
authors = ["CareJournal"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "carejournal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "CareJournal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0.95"
base64 = "0.22.1"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3.31"
bytes = "1.9.0"
gethostname = "0.5.0"
hostname = "0.4.0"
if-addrs = "0.13.3"
mdns-sd = "0.11.5"
mime_guess = "2.0.5"
rand = "0.8.5"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15.2"
sanitize-filename = "0.6.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
tauri = { version = "2.2.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.2.1"
tokio = { version = "1.43.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.4"
uuid = { version = "1.12.1", features = ["v4"] }
warp = { version = "0.3.7", default-features = false }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
